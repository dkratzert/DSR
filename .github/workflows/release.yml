name: publish
on:
  push:
    tags:
      - '*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install xclip
        run: sudo apt-get install -y xclip
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Test with Pytest
        run: |
          export DSR_DIR=${HOME}/.local/bin
          mkdir -p ${HOME}/.local/bin
          echo ${HOME}/.local/bin >> $GITHUB_PATH
          curl -o ${HOME}/.local/bin/shelxl https://dkratzert.de/files/shelx/shelxl
          chmod a+x src/dsr_shelx/dsr
          chmod a+x ${HOME}/.local/bin/shelxl
          cp -r src/dsr_shelx/dsr ${HOME}/.local/bin/dsr
          cp -r * ${HOME}/.local/bin/

          export DSR_DIR=src/dsr_shelx
          pytest --verbose

  build:
    needs: [ 'test' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install --upgrade twine
          pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist

  pypi-publish:
    needs: [ 'build' ]
    environment: 'publish'

    name: upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/